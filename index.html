<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>FilterCam</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="app">
    <!-- Shown while we wait for the camera permission prompt. -->
    <section id="loading" class="screen"></section>

    <!-- Shown when the camera can't be used. -->
    <section id="denied" class="screen message" hidden>
      <svg class="message-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9Zm3 5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/>
      </svg>
      <h1 id="denied-title">Camera Access Needed</h1>
      <p id="denied-text">FilterCam needs your camera to snap photo booth pictures.</p>
      <button id="retry" class="btn prominent" type="button">Try Again</button>
    </section>

    <!-- The camera screen: live preview, shutter button, countdown, and flash. -->
    <section id="booth" class="screen" hidden>
      <video id="preview" playsinline muted autoplay></video>
      <canvas id="mosh" hidden title="Tap to wipe the mosh"></canvas>

      <div id="countdown" class="countdown" aria-live="assertive"></div>

      <div class="booth-ui">
        <div class="top-bar">
          <button id="mosh-toggle" class="pill" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path fill="currentColor" d="M3 19.6 15.6 7l1.4 1.4L4.4 21 3 19.6ZM17 2l.9 2.1L20 5l-2.1.9L17 8l-.9-2.1L14 5l2.1-.9L17 2Zm3.5 6 .6 1.4 1.4.6-1.4.6-.6 1.4-.6-1.4-1.4-.6 1.4-.6.6-1.4ZM10 2l.6 1.4L12 4l-1.4.6L10 6l-.6-1.4L8 4l1.4-.6L10 2Z"/>
            </svg>
            Mosh
          </button>
        </div>
        <div id="shot-counter" class="pill" hidden></div>
        <div class="spacer"></div>
        <button id="shutter" class="shutter" type="button" aria-label="Take photos"></button>
      </div>

      <div id="flash" class="flash"></div>
    </section>

    <!-- The finished strip with Retake, Save, and Share buttons. -->
    <section id="result" class="screen result" hidden>
      <img id="strip" alt="Your photo strip">
      <div class="actions">
        <button id="retake" class="btn" type="button">Retake</button>
        <button id="save" class="btn prominent" type="button">Save</button>
        <button id="share" class="btn" type="button" hidden>Share</button>
      </div>
    </section>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
